[package]
name = "clark-hash"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Clark Hash: stateless sparse Johnson-Lindenstrauss sketches for neural embeddings"
readme = "README.md"
repository = "https://github.com/clark-labs-inc/clark-hash"
documentation = "https://docs.rs/clark-hash/latest/clark_hash/"
keywords = ["embeddings", "quantization", "jl", "hashing", "similarity"]
categories = ["algorithms", "data-structures", "science"]

[features]
default = []
serde = ["dep:serde"]
fastembed = ["dep:fastembed"]

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"], optional = true }
fastembed = { version = "5.13", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
flate2 = "1.1"
rand = "0.8"
rand_distr = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "fastembed_pipeline"
harness = false
required-features = ["fastembed"]
